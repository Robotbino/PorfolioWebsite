<div class="orbit-stage" #stage>
  <!-- Two stacked crops of the same composition, one per theme. Light sits
  underneath at full opacity and only the dark one fades over it, so a theme
  switch never shows the page through a half-faded pair. Neither is ever
  display:none, which would stop a lazy image from loading and make the first
  switch flash. -->
  <div class="orbit-pocket" aria-hidden="true">
    <img class="pocket pocket-light" src="/assets/toolset/black-hole-light-640.webp"
      srcset="/assets/toolset/black-hole-light-320.webp 320w, /assets/toolset/black-hole-light-640.webp 640w"
      sizes="(max-width: 968px) 19.2rem, 17rem" width="640" height="480" alt="" loading="lazy"
      decoding="async">
    <img class="pocket pocket-dark" src="/assets/toolset/black-hole-dark-640.webp"
      srcset="/assets/toolset/black-hole-dark-320.webp 320w, /assets/toolset/black-hole-dark-640.webp 640w"
      sizes="(max-width: 968px) 19.2rem, 17rem" width="640" height="480" alt="" loading="lazy"
      decoding="async">
  </div>

  <!-- The ring lines come from the same projection as the logos' keyframes, in
  the stage's own 100 × 75 units, so each logo stays on its line. The stops are
  coloured in the stylesheet so they follow the theme. -->
  <svg class="orbit-rings" viewBox="0 0 100 75" aria-hidden="true" focusable="false">
    <defs>
      @for (ring of rings; track ring.name) {
        <linearGradient [attr.id]="ring.gradientId" gradientUnits="userSpaceOnUse"
          [attr.x1]="ring.gradient.x1" [attr.y1]="ring.gradient.y1" [attr.x2]="ring.gradient.x2"
          [attr.y2]="ring.gradient.y2">
          <stop class="ring-far" offset="0" />
          <stop class="ring-near" offset="1" />
        </linearGradient>
      }
    </defs>
    @for (ring of rings; track ring.name) {
      <path class="orbit-ring" [attr.d]="ring.path" [attr.stroke]="'url(#' + ring.gradientId + ')'" />
    }
  </svg>

  <!-- The logos are the content: each <img> carries the tool's name. The inline
  style is the logo's resting pose, so the picture is complete before any
  animation starts and after one is cancelled. -->
  <ul class="orbit-tools" role="list">
    @for (orbit of orbits; track orbit.tool.name) {
      <li #logo class="orbit" [class.rim]="orbit.tool.rim" [style.--fit]="orbit.tool.fit"
        [style.transform]="orbit.rest.transform" [style.opacity]="orbit.rest.opacity">
        <img [src]="orbit.tool.src" [alt]="orbit.tool.name" [attr.width]="orbit.tool.width"
          [attr.height]="orbit.tool.height" loading="lazy" decoding="async">
      </li>
    }
  </ul>
</div>
