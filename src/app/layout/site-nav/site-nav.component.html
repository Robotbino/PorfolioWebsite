<header class="navigation-bar" [class.menu-open]="menuOpen()">
  <nav class="navigation-content" aria-label="Main navigation">
    <a class="logo" href="#dest-home" (click)="scrollToSection('dest-home', $event)"
       aria-label="Bino Hlongwana — home">Bino<span class="logo-dot" aria-hidden="true">.</span></a>
    <ul class="nav-items" role="list">
      @for (d of destinations; track d.id) {
        <!-- Desktop omits Home: the logo is the Home link. -->
        @if (d.id !== 'dest-home') {
          <li>
            <a [href]="'#' + d.id" (click)="scrollToSection(d.id, $event)" class="nav-link">{{ d.label }}</a>
          </li>
        }
        <!-- Projects is a sub-anchor inside Work, not a destination — kept explicit, right after Experience. -->
        @if (d.id === 'dest-work') {
          <li>
            <a href="#projects" (click)="scrollToSection('projects', $event)" class="nav-link">Projects</a>
          </li>
        }
      }
    </ul>
    <div class="nav-actions">
      <button class="menu-trigger" #menuTrigger [class.open]="menuOpen()"
              (click)="toggleMenu()"
              [attr.aria-expanded]="menuOpen()"
              aria-controls="mobile-nav"
              [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'">
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
        <span class="menu-bar"></span>
      </button>
      <app-theme-toggle></app-theme-toggle>
    </div>
  </nav>
</header>

<!-- A real modal: role + aria-modal say so, and PageInertService makes it true
     by inerting everything outside this element while it is open. Without that
     the overlay is the last element in the document, so Tab from the last link
     walks straight into the page behind the scrim. -->
<!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events --
     Dismissing by clicking the scrim has a keyboard equivalent already: Escape,
     handled on the component. The rule's suggested fix — a key handler on this
     div — would need the div focusable, adding a phantom tab stop inside a
     dialog whose whole point is a contained tab order. -->
<div class="mobile-overlay" id="mobile-nav"
     #mobileOverlay
     role="dialog"
     aria-modal="true"
     aria-label="Site menu"
     [class.open]="menuOpen()"
     [attr.aria-hidden]="!menuOpen()"
     (click)="onScrimClick($event)">
  <nav class="mobile-nav" aria-label="Mobile navigation">
    @for (d of destinations; track d.id) {
      <a [href]="'#' + d.id" (click)="scrollToSection(d.id, $event); closeMenu()" class="mobile-link">{{ d.label }}</a>
      <!-- Projects sub-anchor inside Work, kept explicit right after Experience. -->
      @if (d.id === 'dest-work') {
        <a href="#projects" (click)="scrollToSection('projects', $event); closeMenu()" class="mobile-link">Projects</a>
      }
    }
  </nav>
</div>
